<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Converter</title>

  <!-- PWA -->
  <!-- Use Vite's base URL replacement so the manifest is referenced relative to the site base -->
  <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#0ea5e9" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="%BASE_URL%icons/192.png" />

    <!-- iOS Support -->
  <link rel="apple-touch-icon" href="%BASE_URL%icons/192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body class="bg-slate-900 text-white">
    <div id="root"></div>
    <!-- Module entry should NOT be prefixed with the base; Vite resolves /src during build/dev -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
